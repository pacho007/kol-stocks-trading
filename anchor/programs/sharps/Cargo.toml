[package]
name = "sharps"
version = "0.1.0"
description = "On-chain custody + share accounting for SHARPS listings, priced by the oracle's rate-capped performance score."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sharps"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

# Anchor.toml pins [toolchain] solana_version = "3.1.10" (new enough to
# handle edition2024 crates) instead of the 1.18.17 anchor-lang 0.30.1
# would otherwise auto-select, whose bundled rustc (1.75.0) predates
# edition2024. These two pins are belt-and-suspenders left over from
# diagnosing that: solana-program requires blake3's "digest" feature
# (exists from 1.5.5 onward), and blake3 >=1.8.1 bumped that feature's own
# `digest` dependency to 0.11, which needs edition2024 (via block-buffer
# 0.12) — 1.5.5..=1.8.0 all pin digest ^0.10.1, so 1.5.5 avoids the edge.
blake3 = "=1.5.5"
block-buffer = "=0.10.4"
