# fly.toml app configuration file generated for sharps-oracle on 2026-09-06T02:02:47+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sharps-oracle'
primary_region = 'iad'

[build]
  dockerfile = 'oracle/Dockerfile'

[env]
  CYCLE_SECONDS = '1200'
  # Where the market program lives. Traders themselves are always read from
  # Solana mainnet via the TRADER_RPC_URL secret, whatever this says.
  SOLANA_CLUSTER = 'devnet'
  ONCHAIN_MIN_SCORE_DELTA = '2'
  # LAUNCH_TS (unix seconds) pins the start of the scoring window: only trades
  # after it count. Set it explicitly for the Solana launch — without it the
  # oracle stamps "now" on first boot into oracle/.launch, which lives in the
  # image and is lost on redeploy, resetting every score.
  # LAUNCH_TS = ''

# Secrets (fly secrets set …):
#   TRADER_RPC_URL   dedicated Solana mainnet RPC for reading trader wallets
#   ORACLE_KEYPAIR   the oracle key as a JSON byte array
#   ORACLE_SYNC_URL / ORACLE_SYNC_SECRET   listing_metrics sync endpoint

[processes]
  oracle = 'npx tsx oracle/run.ts'

[[vm]]
  # Network-bound work; the per-wallet history cache is the memory cost.
  size = 'shared-cpu-1x'
  memory = '1024mb'
