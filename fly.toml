# fly.toml app configuration file generated for sharps-oracle on 2026-09-06T02:02:47+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sharps-oracle'
primary_region = 'iad'

[build]
  dockerfile = 'oracle/Dockerfile'

[env]
  CYCLE_SECONDS = '1200'
  LAUNCH_TS = '1786587668'
  ONCHAIN_MIN_SCORE_DELTA = '2'
  ROBINHOOD_NETWORK = 'mainnet'

[processes]
  oracle = 'npx tsx oracle/run.ts'

# Persists the oracle's trace cache across restarts.
#
# debug_traceTransaction is the only source of sell proceeds on this chain, and
# a cold pass over 126 wallets is tens of thousands of traces — hours of wall
# clock and real money. Held only in the process, that cost is paid again on
# every deploy, scale change and crash. A mined trace never changes, so the
# cache is safe to keep forever and there is nothing to invalidate.
[mounts]
  source = 'trace_cache'
  destination = '/data'

[[vm]]
  # CPU was never the constraint, despite a load average that suggested it.
  # Measured: a trace response parses in ~1ms and arrives in ~77ms, so the work
  # is network-bound and Node's single thread is nowhere near saturated. The
  # earlier slowness was throughput exceeding the plan's compute-unit budget
  # and disappearing into backoff; ALCHEMY_TRACES_PER_SEC is the fix, not cores.
  size = 'shared-cpu-1x'
  # 512mb OOM-looped when the Blockscout provider cached every history row in
  # memory. The Alchemy path holds no row cache and the trace cache is one
  # number per transaction, so that pressure is gone — but a wallet's transfer
  # pages are still tens of MB in flight, and this is not the place to be
  # exactly right.
  memory = '1024mb'
