# Fly.io config for the SHARPS oracle.
#
# Deliberately NOT a web service: there is no HTTP listener, nothing routes to
# it, and it must never be scaled to zero — it is a worker whose whole job is
# to stay up and keep reading the chain.
#
# Deploy:
#   fly launch --no-deploy --copy-config    (first time only)
#   fly secrets set MARKET_ADDRESS=0x... \
#                   ORACLE_AUTHORITY_PRIVATE_KEY=0x... \
#                   BLOCKSCOUT_API_KEY=... \
#                   SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
#   fly deploy

app = "sharps-oracle"
primary_region = "iad"

[build]
  dockerfile = "oracle/Dockerfile"

[env]
  # Pause BETWEEN cycles, so the effective cadence is cycle + pause.
  #
  # 900, not 30, and the reason is gas rather than speed. Mainnet gas measured
  # 0.334 gwei against testnet's 0.01 — 33x — and each changed listing costs
  # ~61,500 gas to push. At a 30s pause (~70s effective, 1,234 cycles/day) a
  # modest 20-listing churn runs about $1,300/day. At 900 the same churn is
  # about $96/day for a board that still refreshes four times an hour.
  #
  # Start here, watch a real day's spend and the actual churn, then tighten if
  # the numbers justify it. Tightening is one deploy; an unexpected four-figure
  # gas bill is not recoverable.
  CYCLE_SECONDS = "900"

  # Mainnet. This machine signs with the oracle authority key and writes prices
  # the whole board is read off, so it must target the same chain the site
  # trades on — chain 4663.
  #
  # A wrong value here is caught rather than silently tolerated: push-onchain
  # checks that MARKET_ADDRESS actually has code on this network AND that the
  # key is the contract's oracleAuthority, and throws on either mismatch. So
  # flipping this without updating the MARKET_ADDRESS secret fails loudly on
  # the next cycle instead of quietly publishing to the wrong chain.
  ROBINHOOD_NETWORK = "mainnet"

  # Pin the launch gate. Scores count only trades after this instant, which is
  # what every listing bio promises. Left unset, the oracle stamps "now" on
  # first boot — so a redeploy that lost the file would reset every listing to
  # a neutral 50 and unwind its price. Set this to the mainnet go-live epoch
  # BEFORE the first deploy, and never change it afterwards.
  LAUNCH_TS = "1786587668"

# One machine, always on. auto_stop_machines would suspend the process, throw
# away the incremental cache, and make every wake-up pay for a cold crawl —
# which is the batch behaviour this replaced.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  oracle = "npx tsx oracle/run.ts"

# No [http_service] block on purpose: nothing should be able to reach this
# from the internet. It holds the oracle authority key.
